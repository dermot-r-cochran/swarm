name: CI

# Runs the test suite on every pull request and on pushes to main.
#
# The point is that the guards in tests/ execute without anyone remembering
# to run them - a test that only runs when someone types `pytest` is a
# convention, and conventions lose to convenience. That matters most for
# the invariant guards (ADR-0003's write isolation, the append-only memory
# checks), which exist to fail when a future change breaches them.
#
# GitHub Actions is used because this repository is hosted here; nothing in
# the workflow depends on a cloud provider, an LLM vendor, or an
# orchestration framework, per AGENTS.md principle 10.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      # Report every version's result rather than stopping at the first
      # failure: "fails on 3.13 only" and "fails everywhere" are different
      # findings and both are worth seeing in one run.
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        # --cov-fail-under is a ratchet, not a target: each figure is the
        # measured coverage on the day it was set (95 when the gate was
        # added 2026-08-24; 100 on 2026-08-27, 388 statements, 0 missed),
        # so it can only be raised, never quietly fallen below. Raise it in
        # the same change that adds the tests that earn it.
        run: pytest --cov=episteme --cov-fail-under=100

  lint:
    # This job exists now because the findings are fixed - an earlier revision
    # of this workflow deliberately shipped without it: `ruff check .` reported
    # 56 findings on the existing code, and a permanently failing check teaches
    # everyone to ignore checks. The findings were fixed on 2026-08-24 in the
    # same change that added this job, so it was green the moment it existed -
    # exactly the deal the old comment here promised.
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: ruff check
        run: ruff check .

  typecheck:
    # Deliberately non-strict: the [tool.mypy] block in pyproject.toml is a
    # baseline that passed on the day it was added, so this job was green
    # the moment it existed - the same deal the lint job's header records.
    # Strict mode is a separate decision (it requires redesigning the
    # optional-id dataclass pattern), not a config flip here.
    name: mypy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: mypy
        run: mypy

  docs:
    # Standard library only, so nothing is installed. Fails on a broken
    # relative link in README.md or docs/, a second front-matter block, and
    # a README layout or ADR index that does not match the disk. Added
    # 2026-10-10 with the README-proof convention; see TestingStrategy.md.
    name: docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Doc check
        run: python .github/scripts/check_docs.py
