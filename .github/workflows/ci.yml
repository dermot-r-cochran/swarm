name: CI

# Runs the test suite on every pull request and on pushes to main.
#
# The point is that the guards in tests/ execute without anyone remembering
# to run them - a test that only runs when someone types `pytest` is a
# convention, and conventions lose to convenience. That matters most for
# the invariant guards (ADR-0003's write isolation, the append-only memory
# checks), which exist to fail when a future change breaches them.
#
# GitHub Actions is used because this repository is hosted here; nothing in
# the workflow depends on a cloud provider, an LLM vendor, or an
# orchestration framework, per AGENTS.md principle 10.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      # Report every version's result rather than stopping at the first
      # failure: "fails on 3.13 only" and "fails everywhere" are different
      # findings and both are worth seeing in one run.
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest

# NO LINT JOB YET, deliberately. An earlier revision of this workflow ran
# `ruff check .` and it reported 56 findings on the existing code (37 of them
# auto-fixable, the readable ones being I001 import ordering) - nothing about
# correctness, but enough to make CI red from its first day. A permanently
# failing check teaches everyone to ignore checks, which would cost more than
# the import ordering is worth.
#
# So: tests first, on the grounds that they are what actually guards the
# invariants. Lint comes back in the same change that fixes the findings, so
# it is green the moment it exists. `ruff` stays declared in the dev extra
# below `[tool.ruff]` in pyproject.toml, so `ruff check .` is one command away
# locally in the meantime.
