[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "episteme"
version = "0.1.0"
description = "EPISTEME: An Epistemic Foundation Model architecture"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    # [tool.ruff] below configures ruff, so declare it here rather than
    # leaving CI to install a tool the project never asked for. A floor
    # rather than a pin: this repo has no lockfile, and pinning a version
    # nobody has verified would be a claim about compatibility.
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["episteme*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.ruff]
line-length = 100
target-version = "py311"
